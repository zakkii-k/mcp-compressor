receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s

exporters:
  # mcp-compressor のメトリクスを Prometheus に公開する
  prometheus:
    endpoint: "0.0.0.0:8889"

  # Copilot のトレースを Tempo に転送する
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  debug:
    verbosity: basic

service:
  pipelines:
    # mcp-compressor → metrics pipeline → Prometheus
    metrics:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [prometheus, debug]

    # Copilot → traces pipeline → Tempo
    traces:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [otlp/tempo, debug]
