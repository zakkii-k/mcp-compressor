services:
  telemetry:
    image: python:3.11-slim
    working_dir: /app
    command: python server.py --db /data/telemetry.db
    volumes:
      - .:/app:ro          # server.py を読み込み
      - telemetry-data:/data  # DB を永続化
    ports:
      - "4318:4318"   # データ受信（mcp-compressor + Copilot）
      - "3000:3000"   # ダッシュボード
    restart: unless-stopped

volumes:
  telemetry-data:
