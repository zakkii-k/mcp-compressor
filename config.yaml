# MCP Summarizer 設定ファイル

# 閾値: この文字数を超えた場合に LLM 要約を試みる（パイプライン後の文字数で判定）
threshold_chars: 5000

# 元データの保存先ディレクトリ（可逆圧縮のため）
originals_dir: "originals"

# Ollama の URL
ollama_url: "http://localhost:11434"

# 使用モデル（1行変更で切り替え可能）
# 推奨モデル（16GB RAM 環境）:
#   qwen2.5:3b  - 高速・省メモリ (~2GB)・要約タスクに十分  ← デフォルト
#   qwen2.5:7b  - より高品質・要約精度向上 (~4.5GB)
#   gemma3:4b   - Google製・バランス良好 (~3GB)
#   gemma3:1b   - 最速・最小 (~1GB)・精度は落ちる
model: "qwen2.5:3b"

# パイプラインステージ（実行順。不要なものはコメントアウト）
# 推奨順: TOON（JSON最優先）→ログ系→LLM
pipeline:
  - toon_converter        # JSON を TOON 形式に変換（約30-64%削減、LLM不要）← 要 python-toon
  # toon_converter が使えない場合の代替:
  # - json_compressor     # JSON を minify（約50%削減）
  # - json_table_converter # JSON配列をMarkdownテーブルに変換
  - log_deduplicator      # 繰り返しパターンのログを集約（最大98%削減、LLM不要）
  - log_compressor        # ログの先頭/エラー/末尾を抽出（LLM不要）
  - llm_summarizer        # 上記で閾値以上なら LLM で要約

# ログ圧縮の詳細設定
log_compressor:
  max_lines: 50        # 保持する最大行数（目安）
  keep_errors: true    # ERROR/Exception 行は常に保持する
